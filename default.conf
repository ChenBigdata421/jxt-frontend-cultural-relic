server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;


    # 静态文件服务
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 禁用JavaScript和CSS文件的缓存(开发环境)
        location ~* \.(js|css)$ {
            root   /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # 上传文件静态服务
    location /uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dashboard 概览接口
    location ^~ /api/v1/dashboard {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass $dashboard_backend;
    }

    # 优先匹配GET请求的/api/v1/media
    location ^~ /api/v1/media {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $media_backend;
    }

    # 优先匹配GET请求的/api/v1/archives
    location ^~ /api/v1/archives {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $archives_backend;
    }

    # 优先匹配GET请求的/api/v1/archive-media-relations
    location ^~ /api/v1/archive-media-relations {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $archive_media_relations_backend;
    }

    # 优先匹配GET请求的/api/v1/incidentRecords
    location ^~ /api/v1/incidentRecords {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $incidentRecords_backend;
    }

    # 优先匹配GET请求的/api/v1/incidentRecords
    location ^~ /api/v1/incidentrecord-media-relations {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $incidentrecord_media_relations_backend;
    }

    # 优先匹配GET请求的/api/v1/incidentRecords
    location ^~ /api/v1/incidentrecord-media-info {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $incidentrecord_media_info_backend;
    }

    # 案件路由
    location ^~ /api/v1/cases {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $cases_backend;
    }

    # 案件媒体关联路由
    location ^~ /api/v1/case-media-relations {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $case_media_relations_backend;
    }

    # 证据源媒体路由
    location ^~ /api/v1/evidence-source-media {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $evidence_source_media_backend;
    }

    # 证据媒体路由
    location ^~ /api/v1/evidence-media {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $evidence_media_backend;
    }

    # 文书路由
    location ^~ /api/v1/writs {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $writs_backend;
    }

    # 文书媒体关联路由
    location ^~ /api/v1/writ-media-relations {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $writ_media_relations_backend;
    }

    # 分发任务路由
    location ^~ /api/v1/assignments {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass $assignments_backend;
    }

    # 任务媒体关联路由
    location ^~ /api/v1/task-media-relations {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass $task_media_relations_backend;
    }

    # 流程管理 - 工作流路由
    location ^~ /api/v1/workflows {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $process_backend;
    }

    # 流程管理 - 工作流实例路由
    location ^~ /api/v1/instances {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $process_backend;
    }

    # 流程管理 - 任务路由
    location ^~ /api/v1/tasks {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $process_backend;
    }

    # WebSocket 路由（实时通知）
    location ^~ /api/v1/ws {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        # WebSocket 特定配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_pass http://process-management-api:8003;
    }

    # 流程管理 - 任务路由
    location ^~ /api/v1/documents {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass $documents_backend;
    }

    # 生命周期管理接口 → 转发到 evidence-command（注入默认租户ID以通过多租户中间件）
    location ^~ /api/v1/lifecycle {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID "1";
        proxy_pass http://evidence-command:8001;
    }

    # 处理所有其余/api请求
    location /api {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://security-management:8000;
    }

    # 处理所有其余/api请求
    location /static/uploadfile {
        # 保留原有的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：显式添加 Authorization 头
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://security-management:8000;
    }

    # 错误页面处理
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 安全配置：禁止访问敏感文件
    location ~ /\. {
        deny all;
    }

    # 限制文件上传大小
    client_max_body_size 10M;
}
