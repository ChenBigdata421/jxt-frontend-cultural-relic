server {  
    listen       80;  
    listen  [::]:80;  
    server_name  localhost;  

    # 静态文件服务  
    location / {  
        root   /usr/share/nginx/html;  
        index  index.html index.htm;  
        try_files $uri $uri/ /index.html;  
    }  

    # 优先匹配GET请求的/api/v1/media  
    location ^~ /api/v1/media {  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 使用正则匹配来区分GET请求  
        if ($request_method = GET) {  
            proxy_pass http://evidence-query:8002;  
            break;  
        }  

        # 对于其他method的/api/media请求，默认传送到命令服务  
        proxy_pass http://evidence-command:8001;  
    }   

    # 优先匹配GET请求的/api/v1/enforcement-types  
    location ^~ /api/v1/enforcement-types {  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 使用正则匹配来区分GET请求  
        if ($request_method = GET) {  
            proxy_pass http://evidence-query:8002;  
            break;  
        }  

        # 对于其他method的请求，默认传送到命令服务  
        proxy_pass http://evidence-command:8001;  
    }  

    # 处理所有其余/api请求  
    location /api {  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        proxy_pass http://security-management:8000;  
    }   

    # 错误页面处理  
    error_page   500 502 503 504  /50x.html;  
    location = /50x.html {  
        root   /usr/share/nginx/html;  
    }  

    # 安全配置：禁止访问敏感文件  
    location ~ /\. {  
        deny all;  
    }  

    # 限制文件上传大小  
    client_max_body_size 10M;  
}  