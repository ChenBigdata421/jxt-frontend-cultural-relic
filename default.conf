server {  
    listen       80;  
    listen  [::]:80;  
    server_name  localhost;  

   
    # 静态文件服务
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 上传文件静态服务
    location /uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 优先匹配GET请求的/api/v1/media  
    location ^~ /api/v1/media {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $media_backend;  
    }   

    # 优先匹配GET请求的/api/v1/enforcement-types  
    location ^~ /api/v1/enforcement-types {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $enforcement_types_backend;  
    } 
    
    # 优先匹配GET请求的/api/v1/archives
    location ^~ /api/v1/archives {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $archives_backend;  
    }

    # 优先匹配GET请求的/api/v1/archive-media-relations
    location ^~ /api/v1/archive-media-relations {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $archive_media_relations_backend;  
    }

    # 优先匹配GET请求的/api/v1/incidentRecords
    location ^~ /api/v1/incidentRecords {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $incidentRecords_backend;  
    }

    # 优先匹配GET请求的/api/v1/incidentRecords
    location ^~ /api/v1/incidentrecord-media-relations {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass $incidentrecord_media_relations_backend;  
    }

    # 处理所有其余/api请求  
    location /api {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass http://security-management:8000;  
    }   

    # 处理所有其余/api请求  
    location /static/uploadfile {  
        # 保留原有的代理头  
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  

        # 重要：显式添加 Authorization 头  
        proxy_set_header Authorization $http_authorization;  

        proxy_pass http://security-management:8000;  
    }  

    # 错误页面处理  
    error_page   500 502 503 504  /50x.html;  
    location = /50x.html {  
        root   /usr/share/nginx/html;  
    }  

    # 安全配置：禁止访问敏感文件  
    location ~ /\. {  
        deny all;  
    }  

    # 限制文件上传大小  
    client_max_body_size 10M;  
}  