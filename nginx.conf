user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    # 重要：添加 DNS 解析配置
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 10s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 压缩设置
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 路由映射
    map $request_method $media_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    map $request_method $archives_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    map $request_method $archive_media_relations_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    map $request_method $incidentRecords_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    map $request_method $incidentrecord_media_relations_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    map $request_method $incidentrecord_media_info_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 案件路由映射
    map $request_method $cases_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 案件媒体关联路由映射
    map $request_method $case_media_relations_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 证据源媒体路由映射
    map $request_method $evidence_source_media_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 证据源媒体路由映射
    map $request_method $evidence_media_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 文书路由映射
    map $request_method $writs_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 文书媒体关联路由映射
    map $request_method $writ_media_relations_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 分发任务路由映射
    map $request_method $assignments_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # 任务媒体关联路由映射
    map $request_method $task_media_relations_backend {
        GET     http://evidence-query:8002;
        default http://evidence-command:8001;
    }

    # Dashboard 路由映射
    map $request_method $dashboard_backend {
        GET     http://evidence-query:8002;
        default http://evidence-query:8002;
    }

    # 统计分析路由映射（全部只读，走 evidence-query）
    map $request_method $statistics_backend {
        default http://evidence-query:8002;
    }

    # 流程管理路由映射
    map $request_method $process_backend {
        default http://process-management-api:8003;
    }

    map $request_method $documents_backend {
        default http://file-storage-service:8004;
    }

    # 包含其他配置文件
    include /etc/nginx/conf.d/*.conf;
}


