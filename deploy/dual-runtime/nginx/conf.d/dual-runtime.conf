# ============================================================
# Backend Routing Maps (CQRS - Command Query分离)
# ============================================================
# GET 请求 -> Query 服务 (只读)
# POST/PUT/DELETE -> Command 服务 (写入)

map $request_method $media_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $archives_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $archive_media_relations_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $incidentRecords_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $incidentrecord_media_relations_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $incidentrecord_media_info_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $cases_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $case_media_relations_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $evidence_source_media_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $evidence_media_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $writs_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $writ_media_relations_backend {
    GET     http://evidence-query:8002;
    default http://evidence-command:8001;
}

map $request_method $process_backend {
    default http://process-management-api:8003;
}

map $request_method $documents_backend {
    default http://file-storage-service:8004;
}

# ============================================================
# Platform Site (平台管控站)
# ============================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  platform.jxt.com;

    # 静态资源
    location / {
        root   /usr/share/nginx/html/platform;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 禁用JS/CSS缓存
        location ~* \.(js|css)$ {
            root   /usr/share/nginx/html/platform;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # 平台站仅代理平台后端 API（避免误走业务 /api 兜底）
    location ^~ /api/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://platform-control-service:8010;
    }

    # 平台站静态文件（上传的logo等）
    location /static/uploadfile {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://platform-control-service:8010;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html/platform;
    }

    # 安全配置
    location ~ /\. {
        deny all;
    }

    client_max_body_size 10M;
}

# ============================================================
# Business Site (业务管理站)
# ============================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  app.jxt.com;

    # 静态资源
    location / {
        root   /usr/share/nginx/html/business;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 禁用JS/CSS缓存
        location ~* \.(js|css)$ {
            root   /usr/share/nginx/html/business;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # 上传文件静态服务
    location /uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # Evidence Management API Routes (CQRS)
    # ============================================================

    # 媒体资源
    location ^~ /api/v1/media {
